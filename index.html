<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商海浮沉 — LLM驱动放置游戏</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="js-error-debug"></div>
<script>
window.onerror = function(msg, src, line, col, err) {
  var el = document.getElementById('js-error-debug');
  if (el) {
    el.style.display = 'block';
    el.innerHTML += '<div class="js-error-item"><b>' + msg + '</b><br>' + src + ':' + line + '</div>';
  }
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  var el = document.getElementById('js-error-debug');
  if (el) {
    el.style.display = 'block';
    el.innerHTML += '<div class="js-error-item"><b>Promise Error:</b> ' + e.reason + '</div>';
  }
});
</script>

<div id="achievement-banner"><span id="ach-icon" style="font-size:24px;"></span><span id="ach-name" style="font-weight:600;"></span></div>

<div id="topbar">
  <span class="game-title">商海浮沉</span>
  <div class="llm-status"><span class="llm-dot" id="llm-dot"></span><span id="llm-status">LLM检测中...</span></div>
  <span id="game-clock"></span>
  <div style="flex:1;"></div>
  <div class="auto-toggle-wrapper" id="btn-auto-container">
  <span class="auto-toggle-label">托管</span>
  <label class="auto-toggle">
    <input type="checkbox" id="auto-toggle-input">
    <span class="auto-slider"></span>
  </label>
  <span class="auto-toggle-label" id="auto-toggle-status">关闭</span>
</div>
  <button class="btn topbar-btn" onclick="UI.openSettings()" style="background:linear-gradient(135deg,var(--accent-gold),#d97706);">⚙ 设置</button>
  <button id="theme-toggle" onclick="UI.toggleTheme()" title="切换亮色/暗色模式">🌙</button>
  <button class="btn topbar-btn" onclick="UI.openAchievementPanel()" style="background:linear-gradient(135deg,var(--purple),#7c3aed);">🏆 成就</button>
  <button class="btn topbar-btn" onclick="UI.openSkillTree()" style="background:linear-gradient(135deg,var(--teal),#0d9488);">📚 技能树</button>
  <button class="btn topbar-btn" onclick="UI.switchPanel('worldmap')" style="background:linear-gradient(135deg,#6366f1,#4f46e5);">🗺 世界地图</button>
  <button class="btn topbar-btn" onclick="UI.showCityOverview()" style="background:linear-gradient(135deg,#0ea5e9,#0284c7);">🏙️ 城市</button>
  <button class="btn topbar-btn" onclick="UI.switchPanel('milestone')" style="background:linear-gradient(135deg,#f59e0b,#b45309);">🏅 里程碑</button>
  <button class="btn topbar-btn" onclick="UI.switchPanel('intel')" style="background:linear-gradient(135deg,var(--purple),#7c3aed);">🔍 情报</button>
  <button class="btn topbar-btn" onclick="UI.openAdvisor()" style="background:linear-gradient(135deg,#f59e0b,#d97706);">💡 顾问</button>
  <button class="btn topbar-btn" onclick="UI.retireGame()" style="background:linear-gradient(135deg,#6b7280,#374151);margin-right:4px;">⏸ 暂停</button>
</div>

<div id="main-layout">
  <div id="left-panel">
    <div class="panel-section"><div class="panel-title">玩家属性</div><div id="stats-panel"></div></div>
    <div class="panel-section"><div class="panel-title">城市区域</div><div id="regions-panel"></div></div>
    <div class="panel-section" style="flex:1;overflow-y:auto;"><div class="panel-title">我的业务</div><div id="business-list"></div></div>
  </div>
<div id="center-area">
    <div id="center-default">
      <div class="dashboard-grid" id="dashboard"></div>
      <div class="synergy-status" id="synergy-status"></div>
      <div class="panel-section" id="manual-work-area"></div>
      <div id="event-area"></div>
      <div class="panel-section">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span class="panel-title" style="margin:0;">员工管理 (<span id="emp-count">0</span>/<span id="emp-max">5</span>)</span>
          <button class="btn-hire" id="btn-hire" onclick="UI.openHireModal()">+ 招聘新员工</button>
        </div>
        <div id="employee-list"></div>
      </div>
      <div class="panel-section"><div class="panel-title">人脉网络</div><div id="npc-panel"></div></div>
    </div>
    <div id="center-panel" class="dash-panel" style="display:none;flex:1;overflow-y:auto;padding:8px 4px;"></div>
  </div>
  <div id="right-panel">
    <div class="panel-section"><div class="panel-title">当前幕次</div><div id="act-display"></div></div>
    <div class="panel-section"><div class="panel-title">全网热搜</div><div id="hot-search"></div></div>
    <div class="panel-section" style="flex:1;overflow-y:auto;"><div class="panel-title">事件日志</div><div id="event-log"></div></div>
  </div>
</div>

<div id="origin-screen">
  <div style="text-align:center;">
    <h1 class="origin-title">商海浮沉</h1>
    <p class="origin-subtitle">选择你的出身，开启创业之旅</p>
    <div class="origin-cards" id="origin-cards"></div>
    <div style="margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div class="origin-name-row">
        <label class="origin-input-label">主角姓名</label>
        <input id="player-name-input" class="origin-input" type="text" placeholder="请输入你的姓名" maxlength="8" />
      </div>
      <div id="start-warning" class="start-warning">
        ⚠️ 一旦踏上商海征途，便再无回头之路。你的每一个决策都将改写命运，确定要开始吗？
      </div>
      <button class="btn start-btn" id="start-btn" disabled>选择出身，踏上征途</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-hire"><div class="modal"><button class="modal-close" onclick="UI.closeModal('hire')">&times;</button><div class="modal-title">招聘新员工</div><div id="hire-content"></div></div></div>
<div class="modal-overlay" id="modal-decision"><div class="modal"><div class="modal-title" id="decision-title">决策时刻</div><div id="decision-content" style="font-size:13px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px;"></div><div id="decision-choices" style="display:flex;flex-direction:column;gap:8px;"></div></div></div>
<div class="modal-overlay" id="modal-npc"><div class="modal"><button class="modal-close" onclick="UI.closeModal('npc')">&times;</button><div class="modal-title" id="npc-modal-title">NPC对话</div><div id="npc-dialog-content"></div></div></div>
<div class="modal-overlay" id="modal-settings"><div class="modal" style="max-width:720px;"><button class="modal-close" onclick="UI.closeModal('settings')">&times;</button><div class="modal-title">⚙ 游戏设置</div><div id="settings-content"></div></div></div>
<div class="modal-overlay" id="modal-achievements"><div class="modal" style="max-width:520px;"><button class="modal-close" onclick="UI.closeModal('achievements')">&times;</button><div class="modal-title">🏆 成就</div><div id="achievements-content"></div></div></div>
<div class="modal-overlay" id="modal-city-overview"><div class="modal" style="max-width:600px;"><button class="modal-close" onclick="UI.closeCityOverview()">&times;</button><div class="modal-title">🏙️ 城市总览</div><div id="city-overview-content"></div></div></div>
<div class="modal-overlay" id="modal-skills"><div class="modal" style="max-width:600px;"><button class="modal-close" onclick="UI.closeModal('skills')">&times;</button><div class="modal-title">📚 技能树</div><div id="skills-content" class="modal-skills-content"></div></div></div>
<div class="modal-overlay" id="modal-advisor"><div class="modal" style="max-width:640px;"><button class="modal-close" onclick="UI.closeModal('advisor')">&times;</button><div class="modal-title">💡 战略顾问</div><div id="advisor-content"></div></div></div>
<div class="modal-overlay" id="modal-balance"><div class="modal" style="max-width:720px;"><button class="modal-close" onclick="UI.closeBalanceModal()">&times;</button><div class="modal-title">⚖️ 平衡性自检报告</div><div id="balance-report-content"></div></div></div>
<div id="tutorial-overlay"><div class="tutorial-box" id="tutorial-content"></div></div>
<div id="toast-container"></div>
<div id="milestone-overlay"></div>
<div id="keyboard-hints">
  <span class="key-hint"><span class="key-badge">1</span>仪表盘</span>
  <span class="key-hint"><span class="key-badge">2</span>区域</span>
  <span class="key-hint"><span class="key-badge">3</span>业务</span>
  <span class="key-hint"><span class="key-badge">4</span>NPC</span>
  <span class="key-hint"><span class="key-badge">5</span>成就</span>
  <span class="key-hint"><span class="key-badge">6</span>统计</span>
  <span class="key-hint"><span class="key-badge">7</span>排行榜</span>
  <span class="key-hint"><span class="key-badge">8</span>资产</span>
  <span class="key-hint"><span class="key-badge">R</span>里程碑</span>
  <span class="key-hint"><span class="key-badge">Space</span>拉项目</span>
  <span class="key-hint"><span class="key-badge">A</span>托管</span>
  <span class="key-hint"><span class="key-badge">S</span>设置</span>
</div>

<!-- 预加载存档数据（异步 fetch，不阻塞页面渲染） -->
<script>
window.__preloadPromise = fetch('/api/preload')
  .then(function(r) { return r.ok ? r.json() : null; })
  .catch(function() { return null; });
</script>

<!-- 游戏逻辑分文件加载 -->
<script src="storage.js?v=8"></script>
<script src="config.js?v=8"></script>
<script src="data-origins.js?v=8"></script>
<script src="data-businesses.js?v=8"></script>
<script src="data-stocks.js?v=8"></script>
<script src="data-tech.js?v=8"></script>
<script src="data-npcs.js?v=8"></script>
<script src="data-events.js?v=8"></script>
<script src="settings.js?v=8"></script>
<script src="llm.js?v=8"></script>
<script src="core.js?v=8"></script>
<script src="core-stock.js?v=8"></script>
<script src="core-research.js?v=8"></script>
<script src="core-rival.js?v=8"></script>
<script src="advisor.js?v=8"></script>
<script src="events.js?v=8"></script>
<script src="npc.js?v=8"></script>
<script src="ui.js?v=8"></script>
<script src="audio.js?v=8"></script>
<script src="main.js?v=8"></script>
<script>
function quitGame() {
  if (confirm('确定要退出游戏吗？\n\n游戏进度会自动保存。确认后将关闭此页面。')) {
    window.close();
    setTimeout(function() {
      alert('浏览器安全策略限制了自动关闭。\n\n请手动关闭此标签页，或双击运行桌面上的「关闭游戏.bat」彻底退出。');
    }, 300);
  }
}
</script>
<script>
document.getElementById('auto-toggle-input').addEventListener('change', function() {
  if (typeof UI !== 'undefined' && UI.toggleAutoMode) UI.toggleAutoMode();
});
</script>
</body>
</html>
